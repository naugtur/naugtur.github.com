          ### These days, I'm writing security software that uses `with` statements 
          ---
          ### what's inside?

          ![lavamoat](./ilus/lavamoat-underthe.png)
          ---
          ![](./ilus/hardenedjs.svg)

          ## Hardened Javascript

          Provides a secure environment for running code.

          ---

          ```js [15-16|5-6|12-18|8-10|1-3]
          Object.freeze(Object.prototype)
          Object.freeze(Array.prototype)
          Object.freeze(Function.prototype)

          const pretendGlobalObject = { console, location }
          pretendGlobalObject.globalThis = pretendGlobalObject

          const scopeCeiling = new Proxy(pretendGlobalObject, {
            has: () => true
          })

          with (scopeCeiling) {
            (function (){
              'use strict';
              console.log(location.href)  // works    
              document.cookie  // error: document is undefined 
            }).call(pretendGlobalObject)
          }
          ```
          <sub><sup> Not exactly how HardenedJS works 😅</sup></sub>

          ---

          Scope Ceiling at TC39 next week

      history: true,

    });


    function installAnimation(an, icon, delay) {
      var el = document.createElement('span');
      el.classList.add('an-item');
      el.innerHTML = icon;
      an.appendChild(el)
      setTimeout(() => el.classList.add('an-to'), delay);
      return el
    }
    Reveal.addEventListener('slidechanged', (event) => {
      console.log(event.currentSlide)
      if (event.currentSlide.classList.contains('animatedSlide')) {
        var an = event.currentSlide.querySelector('.an-container');
        an.innerHTML = '';
        var pkgs = '📦,'.repeat(30).split(',')
        if (event.currentSlide.classList.contains('bad')) {
          pkgs[4] = '💣';
          pkgs[10] = '🔥';
          pkgs[27] = '👿';
        }
        pkgs.forEach((icon, index) =>
          installAnimation(an, icon, 7777 * Math.log10((index) / 3 + 1))
        )
      }

      if (event.currentSlide.classList.contains('animatedDependency')) {
        const dep = document.querySelector('.adependency');
        const deps = document.querySelector('.dependencies');
        deps.innerHTML = '';
        ' '.repeat(8).split('').forEach((_, index) => {
          setTimeout(() => {
            deps.appendChild(dep.cloneNode(true));
          }, (index + 3) * 1000)
        })
      }
    })
